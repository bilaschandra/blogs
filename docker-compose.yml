services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Overrides .env.local's DATABASE_URL: inside this container "mongo"
      # is the service's hostname on the compose network, not 127.0.0.1.
      DATABASE_URL: mongodb://mongo:27017/bilas_mongo_db
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
